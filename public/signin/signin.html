<!DOCTYPE html>
<html>
    <head>
        <title>SHouse</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <div class="header" style="background-color: rgb(93, 197, 93);">
                <strong class="companyName">SHouse</strong>
            </div>
        <main>
            <form id="signin">
                <h1 class="H1Register">Pieslēgšanās</h1>
                <label for="username">Lietotājavārds</label>
                <input id="username" type="text" autocomplete="username" placeholder="vārds">
                <label for="password">Parole</label>
                <input id="password" type="password" placeholder="********">
                <button type="submit" style="background-color: rgb(149, 234, 149);">Pieslēgties</button>
                <div id="loginError"></div>
            </form>
        </main>
        <script src="signin.js"></script>
    </body>
</html>
