<!DOCTYPE html>
<html>
    <head>
        <title>SHouse</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="header">
                <button type="button" class="companyName" popovertarget="menu"><img src="img/menu.png" width="25px" height="25px">SHouse</button>
                <strong id="name"></strong>
                <small id="role"></small>
                <button id="logoutBtn" style="background-color: rgb(234, 84, 84);" type="button">Iziet<img src="img/right-from-bracket-solid.png" width="20px" height="20px"></button>
            </div>
        </header>

        <div class="appBody">
            <nav>
                <ul>
                    <li><button class="navButton" data-section="home">Sākums</button></li>
                    <li class="hide" data-roles="administrators,noliktavas_darbinieks"><button class="navButton" data-section="addProduct">Pievienot produktu</button></li>
                    <li class="hide" data-roles="administrators"><button class="navButton" data-section="adminAddUser">Pievienot lietotāju</button></li>
                    <li class="hide" data-roles="administrators"><button class="navButton" data-section="users">Lietotāji</button></li>
                </ul>
            </nav>
    
            <main>
                <div id="menu" popover>
                    <ul>
                        <li><button class="navButton" data-section="home">Sākums</button></li>
                        <li class="hide" data-roles="administrators,noliktavas_darbinieks"><button class="navButton" data-section="addProduct">Pievienot produktu</button></li>
                        <li class="hide" data-roles="administrators"><button class="navButton" data-section="adminAddUser">Pievienot lietotāju</button></li>
                        <li class="hide" data-roles="administrators"><button class="navButton" data-section="users">Lietotāji</button></li>
                    </ul>
                </div>
                
                <section id="addProduct" class="panel hide">
                    <h2>Pievienot produktu</h2>
                </section>

                <section id="adminAddUser" class="panel hide">
                    <h2>Izveidot jaunu lietotāju</h2>
                    <form id="newUserForm">
                        <label for="jLietotajvards">Lietotājvārds</label>
                        <input type="text" id="jLietotajvards" required><br>
                        <label for="jVards">Vārds un uzvārds</label>
                        <input type="text" id="jVards" required><br>
                        <label for="jParole">Parole (vismaz 8 simboli)</label>
                        <input type="password" id="jParole" autocomplete="new-password" required><br>
                        <label for="jLoma">Loma</label>
                        <select id="jLoma" required></select><br>
                        <button type="submit" style="margin-left: 10px;">Izveidot lietotāju</button>
                    </form>
                    <div id="adminMessage"></div>
                </section>

                <section id="users" class="panel hide">
                    <h2>Lietotāji</h2>
                </section>
            </main>
        </div>
 
        <script src="app.js"></script>
    </body>
</html>
