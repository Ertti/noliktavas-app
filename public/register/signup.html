<!DOCTYPE html>
<html>
    <head>
        <title>SHouse</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <form id="register">
            <h1 id="hRegister">Reģistrācija</h1><br>
            <label for="name">Vārds: *</label>
            <input id="name" type="text" autocomplete="name" placeholder="Name"><br>
            <label for="surname">Uzvārds:</label>
            <input id="surname" type="text" autocomplete="family-name" placeholder="Surname"><br>
            <label for="password">Parole: *</label>
            <input id="password" type="password" placeholder="**********"><br>
            <label for="email">E-pasts: *</label>
            <input id="email" type="email" autocomplete="email" placeholder="name@gmail.com"><br>
            <p id="haveAcc">Tev jau ir konts? Spied <a href="signin.html">šeit:</a></p><br>
            <p id="obligati">Obligāti *</p><br>
            <button type="submit" id="registerButton">Iesniegt</button><br>
        </form>
        <script src="app.js"></script>
    </body>
</html>
